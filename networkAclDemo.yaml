Resources:
  vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
  subnet01:
    Type: AWS::EC2::Subnet
    Properties:
      CidrBlock: 10.0.0.0/24
      VpcId: !Ref vpc
  subnet02:
    Type: AWS::EC2::Subnet
    Properties:
      CidrBlock: 10.0.1.0/24
      VpcId: !Ref vpc
  acl01:
    Type: AWS::EC2::NetworkAcl
    Properties:
      VpcId: !Ref vpc
  acl011: # define aclRule
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      CidrBlock: 0.0.0.0/0
      RuleAction: allow
      Protocol: -1
      RuleNumber: 100
      NetworkAclId: !Ref acl01
  # typical acl rule
  HttpInboundRule:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref acl01
      RuleNumber: 200
      Protocol: 6
      RuleAction: allow
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 80
        To: 80
  HttpsInboundRule:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref acl01
      RuleNumber: 201
      Protocol: 6
      RuleAction: allow
      CidrBlock: 0.0.0.0/0
      PortRange:
        From: 443
        To: 443
  DenyRule:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      NetworkAclId: !Ref acl01
      RuleNumber: 50
      Protocol: -1
      RuleAction: deny
      CidrBlock: 192.168.1.0/24
  subnetacl011: # associate (acl101, target_subnet)
    Type: AWS::EC2::SubnetNetworkAclAssociation
    Properties:
      NetworkAclId: !Ref acl01
      SubnetId: !Ref subnet01

  # question: what's the diff?
  acltp071:
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      CidrBlock: 0.0.0.0/0
      Egress: true # acl outount rule
      Protocol: -1
      RuleAction: allow
      RuleNumber: 100
      NetworkAclId: !Ref acltp0701
  acltp072: # acl inbound rule
    Type: AWS::EC2::NetworkAclEntry
    Properties:
      CidrBlock: 0.0.0.0/0
      Protocol: -1
      RuleAction: allow
      RuleNumber:200
      NetworkAclId: !Ref acltp0701
  
